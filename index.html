<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Assignment #4 - Attribute Manipulation</title>
</head>
<body>

    <!-- Task 1: Get an Attribute Value -->
    <h2>Task 1: Get Attribute</h2>
    <img id="task1-img" src="https://picsum.photos/200/300" alt="Sample Image 1">

    <!-- Task 2: Change Image Source -->
    <h2>Task 2: Change Image Source</h2>
    <img id="task2-img" src="https://picsum.photos/200/300?random=1" alt="Sample Image 2">
    <br>
    <button id="change-img-btn">Change Image</button>

    <!-- Task 3: Set Attribute to Input Field -->
    <h2>Task 3: Set Attribute</h2>
    <input type="text" id="task3-input">

    <!-- Task 4: Remove an Attribute -->
    <h2>Task 4: Remove Attribute</h2>
    <input type="text" id="task4-input" disabled value="I am disabled">
    <br>
    <button id="enable-btn">Enable Input</button>

    <!-- Task 5: Check if Attribute Exists -->
    <h2>Task 5: Check Attribute Exists</h2>
    <p id="task5-para">This is a paragraph with an ID.</p>

    <!-- Task 6: Change Link Destination -->
    <h2>Task 6: Change Link Destination</h2>
    <a id="task6-link" href="https://www.google.com" target="_blank">Go to Google</a>
    <br>
    <button id="change-link-btn">Change Link</button>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
